# 코드를 올릴 때마다(push, Pull Request) GitHub 서버에서 자동으로 검사해요.
# 하나라도 실패하면 빨간 X가 떠서, 망가진 코드가 배포되기 전에 알 수 있어요.
# 배포 자체는 Vercel이 GitHub 저장소와 연결되어 main 브랜치에 push될 때 자동으로 합니다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 새 커밋이 오면 이전 검사는 취소 (시간 절약)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # package-lock.json에 적힌 버전 그대로 설치 (누가 언제 설치해도 같은 결과)
      - run: npm ci

      # 영어 번역이 빠진 주제가 있으면 여기서 실패 (로컬에서는 경고만 하고 한국어로 대체)
      - run: npm run content -- --strict

      # 콘텐츠 검증 → 타입 검사 → 린트 → 단위 테스트
      - run: npm run check

      - run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
